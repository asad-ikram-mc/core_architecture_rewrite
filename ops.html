<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Amazon CORE — Sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23131A22'/%3E%3Ctext x='32' y='30' text-anchor='middle' fill='%23FFFFFF' font-family='Arial,sans-serif' font-size='22' font-weight='700'%3Eazn%3C/text%3E%3Cpath d='M12 42 Q32 54 52 42' fill='none' stroke='%23FF9900' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M48 40 L53 44 L52 38' fill='%23FF9900'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:rgba(148,163,184,.28);--ink:#e6edf3;--muted:#8b949e;--accent:#ff9900;--err:#f87171}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--muted:#57606a;--err:#cf222e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:14px}
h1{margin:0;font-size:20px}
p{margin:0 0 4px;color:var(--muted);font-size:14px}
input{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{padding:10px;border:0;border-radius:8px;background:var(--accent);color:#111;font-weight:700;font-size:15px;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.pw{position:relative;display:flex}.pw input{flex:1;min-width:0;width:100%;padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px;background:none;color:var(--muted);border-radius:6px;display:flex}
.eye:hover{color:var(--ink)}
.err{min-height:1.2em;color:var(--err);font-size:14px}
.loading{color:var(--muted)}
</style>
</head>
<body>
<div id="loading" class="loading" hidden>Loading…</div>
<form id="f" hidden>
  <h1>Amazon CORE docs</h1>
  <p>Sign in with your CORE dashboard login.</p>
  <input name="u" autocomplete="username" placeholder="Username" required>
  <div class="pw"><input name="p" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" class="eye" id="eye" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line id="eye-off" x1="3" y1="3" x2="21" y2="21" style="display:none"/></svg></button></div>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
// Sign-in shell. The site content is not in this public repo: after sign-in it
// is fetched from the core-docs-data API, which checks the token on every request.
var PAGE='ops.html';
var AUTH_LOGIN='https://3dn21iibth.execute-api.eu-west-2.amazonaws.com/auth-login';
var DOCS_DATA='https://3qmgew3tfq54o4ditybr4raasu0sihil.lambda-url.eu-west-2.on.aws/';
var KEY='core_docs_token';
var f=document.getElementById('f'),err=document.getElementById('err'),ld=document.getElementById('loading');
function tok(){try{return localStorage.getItem(KEY)||'';}catch(e){return '';}}
function setTok(t){try{t?localStorage.setItem(KEY,t):localStorage.removeItem(KEY);}catch(e){}}
function showForm(msg){ld.hidden=true;f.hidden=false;err.textContent=msg||'';f.u.focus();}
function load(){
  var t=tok(); if(!t){showForm();return;}
  f.hidden=true;ld.hidden=false;
  fetch(DOCS_DATA,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,page:PAGE})})
    .then(function(r){
      if(r.status===401){setTok('');throw new Error('Please sign in again.');}
      if(!r.ok) throw new Error('Could not load the page ('+r.status+').');
      return r.json();
    })
    .then(function(d){document.open();document.write(d.html);document.close();})
    .catch(function(e){showForm(e.message);});
}
f.addEventListener('submit',function(ev){
  ev.preventDefault();var b=f.querySelector('button[type=submit]');b.disabled=true;err.textContent='';
  fetch(AUTH_LOGIN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:f.u.value,password:f.p.value})})
    .then(function(r){return r.json().then(function(j){if(!r.ok||!j.token)throw new Error(j.error||'Sign-in failed');return j;});})
    .then(function(j){setTok(j.token);f.p.value='';load();})
    .catch(function(e){err.textContent=e.message;})
    .then(function(){b.disabled=false;});
});
document.getElementById('eye').addEventListener('click',function(){
  var show=f.p.type==='password';f.p.type=show?'text':'password';
  document.getElementById('eye-off').style.display=show?'':'none';
  this.setAttribute('aria-label',show?'Hide password':'Show password');this.title=this.getAttribute('aria-label');
});
load();
</script>
</body>
</html>
